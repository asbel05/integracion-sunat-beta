services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: integracion-sunat-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_COLLATION: "Modern_Spanish_CI_AS"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SunatBeta123!@}"
    ports:
      - "1434:1433"
    volumes:
      - integracion_sunat_sql_data:/var/opt/mssql/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  integracion_sunat_sql_data: